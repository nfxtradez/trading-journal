<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0f" />
    <title>TradeLog — Offline</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; background: #0b0c0f; color: #f3f4f6;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
      }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 20px 0 6px; }
      p { color: #8b919e; font-size: 14px; margin: 0 0 20px; }
      button { background: #3b82f6; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>TradeLog needs a connection to load your journal.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
